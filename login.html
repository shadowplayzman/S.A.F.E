<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.A.F.E | Log In</title>
    <link rel="stylesheet" href="SAFE.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <span class="logo-icon">🛡️</span>
            <div>
                <h2>S.A.F.E</h2>
                <p>SHELTER ALLOCATION</p>
            </div>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="shelters.html">Shelters</a>
            <a href="index.html#finder">Finder</a>
            <a href="dashboard.html">Dashboard</a>
        </nav>
    </header>

    <main style="max-width: 450px; margin: 60px auto; padding: 20px;">
        <div style="background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08);">
            <h2 style="margin-bottom: 8px;">Welcome Back</h2>
            <p style="color: #666; margin-bottom: 24px;">Log in to track your shelter requests.</p>

            <form id="login-form">
                <div class="form-group" style="margin-bottom: 16px;">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" placeholder="name@example.com" required style="width: 100%; padding: 10px; margin-top: 6px; border: 1px solid #ccc; border-radius: 6px;">
                </div>

                <div class="form-group" style="margin-bottom: 24px;">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="••••••••" required style="width: 100%; padding: 10px; margin-top: 6px; border: 1px solid #ccc; border-radius: 6px;">
                </div>

                <button type="submit" class="primary-button" style="width: 100%; padding: 12px;">Log In →</button>
            </form>

            <p style="text-align: center; margin-top: 20px; color: #666;">
                Don't have an account? <a href="signup.html" style="color: #10b981; font-weight: bold;">Sign up</a>
            </p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="script.js"></script>
</body>
</html>

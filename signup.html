<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.A.F.E. | Sign Up</title>
    <link rel="stylesheet" href="SAFE.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <span class="logo-icon">🛡️</span>
            <div>
                <h2>S.A.F.E.</h2>
                <p>SHELTER ALLOCATION</p>
            </div>
        </div>
        <a href="index.html" class="secondary-link">Back to Home</a>
    </header>
    <main class="auth-section">
        <div class="auth-card">
            <h1>Create account</h1>
            <p>Join S.A.F.E. to find suitable shelters.</p>
            <form id="signup-form">
                <label for="name">Full name</label>
                <input type="text" id="name" placeholder="Enter your name" required>

                <label for="signup-email">Email address</label>
                <input type="email" id="signup-email" placeholder="Enter your email" required>

                <label for="signup-password">Password</label>
                <input type="password" id="signup-password" placeholder="Create a password" minlength="6" required>

                <label for="confirm-password">Confirm password</label>
                <input type="password" id="confirm-password" placeholder="Confirm your password" required>
                <button type="submit" class="primary-button">Create account →</button>
            </form>
            <p class="auth-switch">
                Already have an account?
                <a href="login.html">Login</a>
            </p>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
